name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    # Pinned (not windows-latest) for reproducibility: windows-latest is being
    # redirected to a newer image, which can shift the preinstalled .NET set and
    # destabilize tooling discovery (see the Check formatting retry below).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore --source https://api.nuget.org/v3/index.json --ignore-failed-sources

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Check formatting
        shell: pwsh
        run: |
          # `dotnet format` intermittently dies at startup with
          # "Unable to locate dotnet CLI" when multiple .NET installs are present
          # on the runner (setup-dotnet's SDK + the image's preinstalled
          # runtime). That's a transient infra flake, not a formatting violation,
          # so retry a few times. A GENUINE formatting failure still fails after
          # all attempts (the loop only short-circuits on exit code 0), so the
          # gate is preserved -- a real violation just takes a bit longer to
          # report.
          $max = 3
          for ($i = 1; $i -le $max; $i++) {
            dotnet format --verify-no-changes --verbosity diagnostic
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($i -lt $max) {
              Write-Host "::warning::dotnet format attempt $i/$max failed (exit $LASTEXITCODE); retrying in 10s..."
              Start-Sleep -Seconds 10
            }
          }
          Write-Host "::error::dotnet format failed after $max attempts."
          exit 1

      - name: Lint (PSScriptAnalyzer)
        shell: pwsh
        # RELEASE.md lists this as a manual pre-tag gate, which meant it only ever ran at the
        # point it was least useful -- right before shipping, by hand. Same command and same
        # pass criterion as that checklist, so the two cannot drift apart.
        #
        # Errors fail the build; warnings are reported and do not. The release procedure asks
        # for warnings to be "reviewed and justified", not driven to zero, and the ones present
        # when this gate was added (Write-Host in the example scripts, unused parameters in the
        # .psm1) all predate it. Annotating them keeps them visible without blocking anything.
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer

          $warnings = @(Invoke-ScriptAnalyzer -Path Staging -Recurse -Severity Warning)
          foreach ($w in $warnings) {
            Write-Host "::warning file=$($w.ScriptPath),line=$($w.Line)::$($w.RuleName): $($w.Message)"
          }
          Write-Host "PSScriptAnalyzer warnings: $($warnings.Count)"

          $errors = @(Invoke-ScriptAnalyzer -Path Staging -Recurse -Severity Error)
          foreach ($e in $errors) {
            Write-Host "::error file=$($e.ScriptPath),line=$($e.Line)::$($e.RuleName): $($e.Message)"
          }
          Write-Host "PSScriptAnalyzer errors: $($errors.Count)"
          if ($errors.Count -gt 0) { exit 1 }

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal

      # Deliberately a SECOND run rather than a flag on the one above. Coverage instrumentation
      # rewrites the assembly, so PartitionGlobalIdPassivenessTests' IL-shape assertions -- which
      # exist to catch a specific PKCE regression -- do not apply to an instrumented build and
      # step aside there. Collecting on the main run would mean they never execute in CI at all.
      # The extra run costs a few seconds.
      - name: Collect coverage
        run: dotnet test --no-build --configuration Release --verbosity quiet --collect:"XPlat Code Coverage" --results-directory ./TestResults

      # No threshold gate: the point of collecting is to establish the number first. Upload
      # only -- a coverage figure nobody can see is not a measurement.
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

      - name: Verify cmdlet inventory (manifest drift)
        shell: pwsh
        # Reflects over the built DLL and reconciles the registrable cmdlets
        # (public + concrete + [Cmdlet]) against the manifest's CmdletsToExport.
        # Fails if a cmdlet was added/removed without updating the manifest.
        run: ./Tests/Get-CmdletInventory.ps1 -DllPath ./UiPathOrch/bin/Release/net8.0/UiPathOrch.dll -FailOnDrift

      - name: Verify help markdown syntax order (drift)
        shell: pwsh
        # docs/help/en-US/*.md is what Get-Help -Online serves, so its SYNTAX
        # blocks have to carry the same canonical parameter order that
        # Reorder-SyntaxParameters.ps1 gives the built MAML. Applying it to the
        # markdown is a manual step that nothing else enforces; this gate is what
        # makes forgetting it visible. Run the reorder and fail if it changed
        # anything, the same shape as the dotnet format gate above.
        run: |
          ./PlatyPS/Reorder-MdSyntaxParameters.ps1 ./docs/help/en-US
          git diff --exit-code -- docs/help/en-US

  # Build + unit-test on Linux and macOS so the "Windows | Linux | macOS" claim is
  # exercised by CI and cross-platform regressions (path handling, browser launch,
  # CSV encoding) are caught. Formatting is verified by the Windows job only.
  crossplat:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore --source https://api.nuget.org/v3/index.json --ignore-failed-sources

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release --verbosity normal
